[package]
name = "wordpress-panel"
version = "0.1.0"
description = "Panel de desarrollo WordPress local optimizado en recursos"
authors = ["Franklin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wordpress_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wordpress-panel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

# Async + Docker
tokio = { version = "1", features = ["full"] }
bollard = "0.18"
futures-util = "0.3"


# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilidades
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", features = ["json", "stream"] }

# D-Bus (interfaz para el plasmoid KDE y el CLI). Solo Linux: en macOS no hay
# bus de sesión. Feature `tokio`: el executor de zbus corre sobre el runtime
# Tokio del panel, no el suyo propio (async-io); si no, los handlers que tocan
# Docker (bollard) panican ("no reactor running").
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Tests: directorios temporales para lógica de ficheros (rotate_dumps, import).
tempfile = "3"
# Feature `test` de Tauri: construir un AppHandle simulado en tests de integración
# (los comandos migrate/import reciben &AppHandle para emitir progreso `op-log`).
tauri = { version = "2", features = ["test"] }

[features]
# default Tauri feature set placeholder
default = []
