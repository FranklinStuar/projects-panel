[package]
name = "wordpress-panel"
version = "0.1.0"
description = "Panel de desarrollo WordPress local optimizado en recursos"
authors = ["Franklin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wordpress_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wordpress-panel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

# Async + Docker
tokio = { version = "1", features = ["full"] }
bollard = "0.18"
futures-util = "0.3"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilidades
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", features = ["json", "stream"] }

[features]
# default Tauri feature set placeholder
default = []
